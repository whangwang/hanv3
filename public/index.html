<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <!-- Per-page <title>, <meta name="description">, Open Graph, and Twitter
         tags are injected by vue-meta at runtime AND baked in at build time
         by the prerender plugin. We intentionally don't ship static defaults
         here so they don't show up as duplicates in the prerendered output. -->
    <title>Han Wang</title>

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GDR2XVWGFJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-GDR2XVWGFJ', { send_page_view: false });
    </script>

    <!-- Single-Page-App fallback decoder. Pairs with public/404.html — when
         GitHub Pages serves 404.html for a deep-link, that page redirects to
         "/?/the/path", and this script reconstructs the original URL via the
         History API so Vue Router can render the right page. -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>

    <!-- Legacy hash-URL redirect. Old bookmarks like /#/work/authux become
         /work/authux (history mode). Runs synchronously before Vue boots. -->
    <script>
      (function () {
        var hash = window.location.hash;
        if (hash && hash.indexOf('#/') === 0) {
          var target = hash.slice(1) + window.location.search;
          window.history.replaceState(null, null, target);
        }
      })();
    </script>

    <link rel="apple-touch-icon" sizes="180x180" href="<%= BASE_URL %>fav/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="<%= BASE_URL %>fav/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="<%= BASE_URL %>fav/favicon-16x16.png">
    <link rel="manifest" href="<%= BASE_URL %>fav/site.webmanifest">
    <link rel="mask-icon" href="<%= BASE_URL %>fav/safari-pinned-tab.svg" color="#000F46">
    <meta name="msapplication-TileColor" content="#000F46">
    <meta name="theme-color" content="#ffffff">
  </head>
  <body>
    <noscript>
      <strong>This site requires JavaScript to render the interactive case studies. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
